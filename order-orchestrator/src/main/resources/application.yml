# Defaults match deploy/docker-compose.yml for development. Set the variables in any other
# environment; see docs/DEPLOYMENT.md.
spring:
  application:
    name: order-orchestrator
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ORCHESTRATOR_DATABASE_URL:jdbc:postgresql://localhost:5432/orderloop}
    # Never an owner or superuser: row-level security must apply (invariant 2).
    username: orderloop_app
    password: ${POSTGRES_APP_PASSWORD:orderloop_app_dev}
    hikari:
      maximum-pool-size: 10
  flyway:
    user: orderloop_owner
    password: ${POSTGRES_OWNER_PASSWORD:orderloop_owner_dev}
    schemas: orchestrator
    # Per service, so services can share a test classpath without running each other's migrations.
    locations: classpath:db/migration/orchestrator
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      # A new consumer group reads replies from the start, so none sent before it joined is lost.
      auto-offset-reset: earliest

orderloop:
  outbox:
    schema: orchestrator
    ops-password: ${POSTGRES_OPS_PASSWORD:orderloop_ops_dev}
  orchestrator:
    # How often to look for missed deadlines; a deadline fires at most this late.
    deadline-poll-interval: 5s

# JSON logs with traceId, spanId, tenantId and orderId from MDC (docs/ARCHITECTURE.md).
logging:
  structured:
    format:
      console: logstash

management:
  otlp:
    metrics:
      export:
        # Off by default. With the telemetry profile of deploy/docker-compose.yml up, set
        # MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true, and for spans
        # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://localhost:4318/v1/traces.
        enabled: false
        url: http://localhost:9090/api/v1/otlp/v1/metrics
        step: 15s
  tracing:
    sampling:
      # Every order is traced; lower it if trace volume ever matters.
      probability: 1.0
