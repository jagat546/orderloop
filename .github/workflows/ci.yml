name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check repository invariants
        run: bash scripts/check-invariants.sh

      - name: Test Claude Code hooks
        run: bash scripts/test-hooks.sh

      - name: Build, format check, ArchUnit and tests
        run: mvn -B -ntp verify

  secrets:
    # The whole git history, not only the new commits, with the allowlist in .gitleaks.toml. The
    # pinned image is the scan run before publication (roadmap P.3); no licence key or token needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.28.0 git /repo --config /repo/.gitleaks.toml --redact --no-banner -v
